<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de menú · Buen Sabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ff9f1c' stroke='%23a31621' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='%23a31621' font-family='Arial'%3EBS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <nav class="nav" aria-label="Principal">
    <div class="logo" role="img" aria-label="Logo de Buen Sabor">BS</div>
    <span class="brand">Buen Sabor</span>
    <ul>
      <li><a href="inicio.html">Inicio</a></li>
      <li><a href="menu.html">Menú</a></li>
      <li><a href="index.html">Reservas</a></li>
      <li class="dropdown">
        <button class="btn-dropdown" type="button" id="btnAdminNav" aria-haspopup="true" aria-expanded="false">
          Administración ▾
        </button>
        <ul class="dropdown-menu" id="adminMenu" hidden>
          <li><a href="#" data-soon>🗓️ Agenda y aforo</a></li>
          <li><a href="carta-admin.html" aria-current="page" class="active">🍽️ Carta gastronómica</a></li>
          <li><a href="establecimiento.html">🏪 Información del establecimiento</a></li>
        </ul>
      </li>
    </ul>
    <div class="dropdown">
      <button class="btn-dropdown login" type="button" id="btnUserMenu" aria-haspopup="true" aria-expanded="false">
        👤 Administrador ▾
      </button>
      <ul class="dropdown-menu" id="userMenu" hidden>
        <li><a href="#" id="btnLogout">Cerrar sesión</a></li>
      </ul>
    </div>
  </nav>
</header>

<main>
    <section class="panel" id="pMenu" aria-labelledby="hMenu">
    <div class="panel-header">
        <h2 id="hMenu"><span class="n">1</span>Catálogo de platos</h2>
    </div>

    <details class="panel" style="margin-bottom:18px;padding:16px 24px">
      <summary style="cursor:pointer;font-weight:700;color:var(--wine-d)">➕ Agregar nuevo plato</summary>
      <form id="formNuevoPlato" novalidate style="margin-top:16px">
        <div class="grid2">
          <div class="f">
            <label for="npCategoria">Categoría <span class="req">*</span></label>
            <select class="ctl" id="npCategoria" name="categoria"></select>
            <p class="err" id="e-npCategoria"></p>
          </div>
          <div class="f">
            <label for="npNombre">Nombre del plato <span class="req">*</span></label>
            <input class="ctl" id="npNombre" name="nombre" type="text" placeholder="Ej. Ceviche de camarón">
            <p class="err" id="e-npNombre"></p>
          </div>
          <div class="f">
            <label for="npDescripcion">Descripción <span class="req">*</span></label>
            <input class="ctl" id="npDescripcion" name="descripcion" type="text" placeholder="Breve descripción del plato">
            <p class="err" id="e-npDescripcion"></p>
          </div>
          <div class="f">
            <label for="npPrecio">Precio <span class="req">*</span></label>
            <input class="ctl" id="npPrecio" name="precio" type="number" min="0" step="500" placeholder="15000">
            <p class="err" id="e-npPrecio"></p>
          </div>
          <div class="f">
            <label for="npFoto">Foto del plato (opcional)</label>
            <input class="ctl" id="npFoto" name="foto" type="file" accept="image/*">
          </div>  
        </div>
        <button class="btn" type="submit" id="btnAgregarPlato">Agregar plato</button>
      </form>
    </details>

    <div class="cats-filter" id="catsFilter" role="group" aria-label="Filtrar por categoría"></div>

    <div id="listaPlatos"></div>

    <div class="form-actions">
        <button class="btn amber" type="button" id="btnGuardarMenu">Guardar cambios</button>
    </div>

    <div class="alert ok" id="alertaMenuOk" role="status" hidden>
        <span class="ck" aria-hidden="true">✓</span>
        <span>Carta actualizada correctamente</span>
    </div>
    <div class="alert bad" id="alertaMenuErr" role="alert" hidden></div>
    </section>
</main>

<script src="js/datos-menu.js"></script>
<script src="js/carta-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- Administración de la carta: agregar platos, ajustar precios y disponibilidad. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de menú · Buen Sabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ff9f1c' stroke='%23a31621' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='%23a31621' font-family='Arial'%3EBS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="carta-admin">

<!-- Navegación administrativa con menús para las secciones y la cuenta. -->
<header class="top"></header>
<main>
  <!-- Catálogo editable: formulario de alta, filtros por categoría y listado generado por JS. -->
  <section class="panel" id="pMenu" aria-labelledby="hMenu">
    <div class="panel-header">
      <h2 id="hMenu">Catálogo de platos</h2>
    </div>

    <!-- Formulario plegable para incorporar un plato y, opcionalmente, su fotografía. -->
    <details class="panel" style="margin-bottom:18px;padding:16px 24px">
      <summary class="resumen-bloqueo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar nuevo plato</summary>
      <form id="formNuevoPlato" novalidate style="margin-top:16px">
        <div class="grid2">
          <div class="f">
            <label for="npCategoria">Categoría <span class="req">*</span></label>
            <select class="ctl" id="npCategoria" name="categoria"></select>
            <p class="err" id="e-npCategoria"></p>
          </div>
          <div class="f">
            <label for="npNombre">Nombre del plato <span class="req">*</span></label>
            <input class="ctl" id="npNombre" name="nombre" type="text" placeholder="Ej. Ceviche de camarón">
            <p class="err" id="e-npNombre"></p>
          </div>
          <div class="f">
            <label for="npDescripcion">Descripción <span class="req">*</span></label>
            <input class="ctl" id="npDescripcion" name="descripcion" type="text" placeholder="Breve descripción del plato">
            <p class="err" id="e-npDescripcion"></p>
          </div>
          <div class="f">
            <label for="npPrecio">Precio <span class="req">*</span></label>
            <input class="ctl" id="npPrecio" name="precio" type="number" min="0" step="500" placeholder="15000">
            <p class="err" id="e-npPrecio"></p>
          </div>
          <div class="f">
            <label for="npFoto">Foto del plato (opcional)</label>
            <input class="ctl" id="npFoto" name="foto" type="file" accept="image/*">
            <p class="err" id="e-npFoto"></p>
          </div>
        </div>
        <button class="btn" type="submit" id="btnAgregarPlato">Agregar plato</button>
      </form>
    </details>

    <!-- El filtro y las filas del catálogo se construyen dinámicamente en app.js. -->
    <div class="cats-filter" id="catsFilter" role="group" aria-label="Filtrar por categoría"></div>

    <div id="listaPlatos"></div>

    <div class="form-actions">
      <button class="btn amber" type="button" id="btnGuardarMenu">Guardar cambios</button>
    </div>
    <div class="alert ok" id="alertaMenuOk" role="status" hidden>
      <span class="ck" aria-hidden="true">✓</span>
      <span>Carta actualizada correctamente</span>
    </div>
    <div class="alert bad" id="alertaMenuErr" role="alert"></div>
  </section>
</main>

<dialog id="dlgEditar">
  <form class="dlg dlg-editar" id="formEditar" novalidate>
    <div class="foto-edit">
      <img id="edImg" alt="">
      <span id="edEmoji" class="foto-vacia" hidden>Sin foto</span>
      <button class="btn-foto" type="button" id="btnFoto">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Editar foto
      </button>
      <input type="file" id="edFoto" accept="image/*" hidden>
    </div>
    <div class="dlg-cuerpo">
      <h2 id="edTitulo">Editar plato</h2>
      <p class="note" id="edCategoria"></p>
      <div class="f">
        <label for="edDesc">Descripción <span class="req">*</span></label>
        <textarea class="ctl" id="edDesc" rows="3"></textarea>
      </div>
      <div class="f">
        <label for="edPrecio">Precio <span class="req">*</span></label>
        <input class="ctl" id="edPrecio" type="number" min="0" step="500">
      </div>
      <label class="chk"><input type="checkbox" id="edDisp"> Disponible</label>
      <p class="err" id="edErr"></p>
      <div class="dlg-acciones">
        <button class="btn ghost" type="button" id="edCancelar">Cancelar</button>
        <button class="btn amber" type="submit">Guardar cambios</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<!-- Inicializa la gestión de la carta cuando data-page vale "carta-admin". -->
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión · Buen Sabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ff9f1c' stroke='%23a31621' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='%23a31621' font-family='Arial'%3EBS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="top">
  <nav class="nav" aria-label="Principal">
    <div class="logo" role="img" aria-label="Logo de Buen Sabor">BS</div>
    <span class="brand">Buen Sabor</span>
  </nav>
</header>

<main>
  <button class="back" type="button" id="back">← Volver</button>
  <div style="max-width:420px;margin:24px auto 0">
    <section class="panel" id="pLogin" aria-labelledby="hLogin">
      <h2 id="hLogin"><span class="n">1</span>Iniciar sesión</h2>
      <form id="formLogin" novalidate>
        <div class="f">
          <label for="usuario">Usuario <span class="req">*</span></label>
          <input class="ctl" id="usuario" name="usuario" type="text" placeholder="admin" autocomplete="username">
          <p class="err" id="e-usuario"></p>
        </div>
        <div class="f">
          <label for="clave">Contraseña <span class="req">*</span></label>
          <input class="ctl" id="clave" name="clave" type="password" placeholder="••••••••" autocomplete="current-password">
          <p class="err" id="e-clave"></p>
        </div>
        <button class="btn wide" type="submit" id="btnEntrar">Entrar</button>
      </form>
    </section>
  </div>
</main>

<script src="js/login.js"></script>
</body>
</html>

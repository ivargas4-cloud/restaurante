<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda y aforo · Buen Sabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ff9f1c' stroke='%23a31621' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='%23a31621' font-family='Arial'%3EBS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<!-- Tailwind CSS (solo utilidades de diseño; sin reiniciar los estilos propios del sitio) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } }</script>
</head>
<body data-page="agenda">

<header class="top"></header>

<main>
  <h1>Agenda y aforo</h1>

  <div class="filtro-agenda">
  <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  <div class="f">
    <label for="filtroFecha">Filtrar toda la agenda por fecha</label>
    <input class="ctl" type="date" id="filtroFecha">
  </div>
  <button class="btn" type="button" id="btnTodas">Ver todas</button>
</div>

  <!-- Reservas -->
  <section class="panel" aria-labelledby="hRes">
    <h2 id="hRes">Reservas</h2>
    <div id="listaReservas" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>
  </section>

  <!-- Aforo por franja -->
  <section class="panel mt-6" aria-labelledby="hAforo">
    <h2 id="hAforo">Aforo por franja</h2>
    <p class="note mb-4" id="notaAforo"></p>
    <div id="listaFranjas" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div>

    <details class="mt-6">
      <summary class="resumen-bloqueo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Bloquear una franja sin reservas</summary>
      <form id="formBloqueo" novalidate class="mt-4 grid gap-4 sm:grid-cols-3">
        <div class="f">
          <label for="bFecha">Fecha <span class="req">*</span></label>
          <input class="ctl" type="date" id="bFecha">
          <p class="err" id="e-bFecha"></p>
        </div>
        <div class="f">
          <label for="bHora">Hora <span class="req">*</span></label>
          <select class="ctl" id="bHora"></select>
          <p class="err" id="e-bHora"></p>
        </div>
        <div class="f">
          <label for="bZona">Zona <span class="req">*</span></label>
          <select class="ctl" id="bZona"></select>
        </div>
        <div class="sm:col-span-3">
          <button class="btn amber" type="submit">Bloquear franja</button>
        </div>
      </form>
    </details>
  </section>
</main>

<dialog id="dlgConfirmar"><div class="dlg">
  <h2 id="dcTitulo">Confirmar</h2>
  <p id="dcMensaje"></p>
  <div class="dlg-acciones">
    <button class="btn" type="button" id="dcCancelar">Cancelar</button>
    <button class="btn amber" type="button" id="dcAceptar">Aceptar</button>
  </div>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>

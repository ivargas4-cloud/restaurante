<!DOCTYPE html>
<!-- Administración de los datos públicos y servicios del establecimiento. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Información del establecimiento · Buen Sabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ff9f1c' stroke='%23a31621' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='%23a31621' font-family='Arial'%3EBS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="establecimiento">

<!-- Navegación administrativa compartida con las demás secciones de gestión. -->
<header class="top"></header>
<main>

  <!-- Formulario de información: inicia bloqueado y se habilita con "Editar información". -->
  <section class="panel" id="p1" aria-labelledby="h2s">
    <div class="panel-header">
      <h2 id="h2s">Información del establecimiento</h2>
      <button class="btn" type="button" id="btnEditar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>Editar información</button>
    </div>

    <form id="formInfo" novalidate>
      <div class="grid2">
        <!-- Columna izquierda: nombre, dirección, teléfono y horarios. -->
        <div class="f">
          <label for="nombreEst">Nombre del establecimiento <span class="req">*</span></label>
          <input class="ctl" id="nombreEst" name="nombreEst" type="text" value="Buen Sabor" disabled>
          <p class="err" id="e-nombreEst"></p>
        </div>
        <div class="f">
          <label for="direccion">Dirección <span class="req">*</span></label>
          <input class="ctl" id="direccion" name="direccion" type="text" placeholder="Cra 15 #50-20, Medellín" disabled>
          <p class="err" id="e-direccion"></p>
        </div>
        <div class="f">
          <label for="telefono">Teléfono <span class="req">*</span></label>
          <input class="ctl" id="telefono" name="telefono" type="tel" inputmode="numeric" placeholder="3001234567" disabled>
          <p class="err" id="e-telefono"></p>
        </div>
        <div class="f">
          <label for="horarios">Horarios de atención <span class="req">*</span></label>
          <input class="ctl" id="horarios" name="horarios" type="text" placeholder="Lun-Dom 8:00am - 10:00pm" disabled>
          <p class="err" id="e-horarios"></p>
        </div>

        <!-- Columna derecha: descripción, servicios disponibles y galería de imágenes. -->
        <div class="f">
          <label for="descripcion">Descripción <span class="req">*</span></label>
          <textarea class="ctl" id="descripcion" name="descripcion" rows="3" placeholder="Restaurante de comida tradicional." disabled></textarea>
          <p class="err" id="e-descripcion"></p>
        </div>
        <fieldset class="f" id="servicios" disabled>
          <legend>Servicios</legend>
          <label class="chk"><input type="checkbox" id="svcWifi" name="servicios" value="wifi"> Wifi</label>
          <label class="chk"><input type="checkbox" id="svcDomicilios" name="servicios" value="domicilios"> Domicilios</label>
          <label class="chk"><input type="checkbox" id="svcTerraza" name="servicios" value="terraza"> Terraza</label>
          <label class="chk"><input type="checkbox" id="svcMascotas" name="servicios" value="mascotas"> Pet friendly</label>
        </fieldset>
        <div class="f">
          <label for="galeria">Galería de imágenes</label>
          <input class="ctl" id="galeria" name="galeria" type="file" accept="image/*" multiple disabled>
          <p class="err" id="e-galeria"></p>
        </div>
      </div>

      <p class="note"><span class="req">*</span> Los campos marcados son obligatorios.</p>

      <div class="form-actions">
        <button class="btn" type="button" id="btnCancelar" disabled>Cancelar</button>
        <button class="btn amber" type="submit" id="btnGuardar" disabled>Guardar cambios</button>
      </div>
    </form>
    <div class="alert ok" id="alertaOk" role="status" hidden>
      <span class="ck" aria-hidden="true">✓</span>
      <span id="msgOk">Actualización exitosa</span>
    </div>
  </section>

</main>

<div class="toast" id="toast" role="status"></div>
<!-- Inicializa los controles de edición y validación de esta página administrativa. -->
<script src="js/app.js"></script>
</body>
</html>
